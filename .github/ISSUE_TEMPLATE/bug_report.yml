name: Bug Report
description: Report a bug in modern-xlsx
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting a bug! Please fill out the details below.

  - type: textarea
    id: description
    attributes:
      label: Description
      description: What happened? What did you expect to happen?
      placeholder: |
        When I try to read a file with merged cells, the cell values are missing...
    validations:
      required: true

  - type: textarea
    id: reproduction
    attributes:
      label: Reproduction
      description: Minimal code to reproduce the issue.
      render: typescript
      placeholder: |
        import { initWasm, readFile } from 'modern-xlsx';
        await initWasm();
        const wb = await readFile('test.xlsx');
        // ...
    validations:
      required: true

  - type: textarea
    id: sample-file
    attributes:
      label: Sample file
      description: Drag the smallest .xlsx that shows the problem into this box (GitHub accepts .xlsx files up to 25 MB). Remove anything confidential first. Leave it empty if the code above builds the file.

  - type: dropdown
    id: entry-point
    attributes:
      label: Entry point
      description: The import or script that loads modern-xlsx.
      options:
        - modern-xlsx (full build)
        - modern-xlsx/lite
        - Browser bundle (modern-xlsx/browser, the global ModernXlsx)
        - Web Worker (createXlsxWorker, modern-xlsx/worker)
        - modern-xlsx/wasm with initWasmSync
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: Version
      description: "modern-xlsx version (run: npm ls modern-xlsx)"
      placeholder: "for example 1.3.0"
    validations:
      required: true

  - type: dropdown
    id: runtime
    attributes:
      label: Runtime
      options:
        - Node.js
        - Bun
        - Deno
        - Browser (Chrome)
        - Browser (Edge)
        - Browser (Firefox)
        - Browser (Safari)
        - Cloudflare Workers
        - Service Worker
        - Other
    validations:
      required: true

  - type: input
    id: runtime-version
    attributes:
      label: Runtime Version
      placeholder: "Output of node --version, or the browser and its version"

  - type: input
    id: os
    attributes:
      label: Operating System
      placeholder: "Operating system and version"
