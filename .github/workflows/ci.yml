name: CI

on:
  push:
    branches: [main, master]
    tags: ['v*']
  pull_request:
    branches: [main, master]

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  rust:
    name: Rust
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install Rust
        uses: dtolnay/rust-toolchain@beta
        with:
          components: clippy
          targets: wasm32-unknown-unknown

      - name: Cache Cargo
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-

      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Test
        run: cargo test -p modern-xlsx-core

  security:
    name: Security Audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install Rust
        uses: dtolnay/rust-toolchain@beta

      - name: Install cargo-audit
        run: cargo install cargo-audit --locked

      - name: Cargo Audit
        run: cargo audit

      - name: Install pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "26"
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: npm audit
        run: cd packages/modern-xlsx && npm audit --omit=dev || true

  deny:
    name: cargo-deny (licenses/bans/sources)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install Rust
        uses: dtolnay/rust-toolchain@beta
      - name: Install cargo-deny
        run: cargo install cargo-deny --version 0.19.9 --locked
      # Deterministic gate (committed Cargo.lock). Advisories/yanks are covered
      # by the non-gating `security` job (cargo audit) so a same-day CVE can't
      # block a tagged release.
      - name: cargo deny check
        run: cargo deny check licenses bans sources

  fuzz:
    name: Fuzz smoke (reader)
    runs-on: ubuntu-latest
    # Non-deterministic nightly smoke — surfaces real panics as a signal, never blocks CI.
    continue-on-error: true
    # Override rust-toolchain.toml (channel=beta) — cargo-fuzz needs nightly's -Z sanitizer flags.
    env:
      RUSTUP_TOOLCHAIN: nightly
    steps:
      - uses: actions/checkout@v7
      - name: Install Rust nightly
        uses: dtolnay/rust-toolchain@nightly
      - name: Install cargo-fuzz
        run: cargo install cargo-fuzz --locked
      - name: Fuzz read_xlsx (30s smoke)
        run: cargo fuzz run read_xlsx -- -max_total_time=30 -rss_limit_mb=4096
      - name: Fuzz read_xlsx_json (30s smoke)
        run: cargo fuzz run read_xlsx_json -- -max_total_time=30 -rss_limit_mb=4096

  smoke:
    name: Package smoke test (tarball + ./lite)
    needs: rust
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install Rust
        uses: dtolnay/rust-toolchain@beta
        with:
          targets: wasm32-unknown-unknown
      - name: Install wasm-pack
        run: curl https://rustwasm.github.io/wasm-pack/installer/init.sh -sSf | sh
      - name: Build WASM (full + lite)
        run: |
          wasm-pack build crates/modern-xlsx-wasm --target web --release --out-dir ../../packages/modern-xlsx/wasm --no-opt
          wasm-pack build crates/modern-xlsx-wasm --target web --release --no-opt --out-dir ../../packages/modern-xlsx/wasm-lite -- --no-default-features
      - name: Install pnpm
        uses: pnpm/action-setup@v6
      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "26"
          cache: "pnpm"
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Build package
        run: pnpm -C packages/modern-xlsx build
      - name: Pack tarball
        run: cd packages/modern-xlsx && pnpm pack --pack-destination "${RUNNER_TEMP}"
      - name: Install tarball in a clean project and import both entry points
        run: |
          mkdir -p "${RUNNER_TEMP}/smoke" && cd "${RUNNER_TEMP}/smoke"
          npm init -y >/dev/null
          npm install "${RUNNER_TEMP}"/modern-xlsx-*.tgz
          node --input-type=module -e "
            import { Workbook, VERSION } from 'modern-xlsx';
            import { Workbook as LiteWorkbook } from 'modern-xlsx/lite';
            if (typeof Workbook !== 'function') throw new Error('main export broken');
            if (typeof LiteWorkbook !== 'function') throw new Error('./lite export broken');
            console.log('smoke ok — modern-xlsx', VERSION, '+ /lite import works');
          "

  typescript:
    name: TypeScript (Node ${{ matrix.node-version }}, ${{ matrix.os }})
    needs: rust
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        node-version: ["24", "26"]
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v7

      - name: Install Rust
        uses: dtolnay/rust-toolchain@beta
        with:
          targets: wasm32-unknown-unknown

      - name: Cache Cargo
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-

      - name: Install wasm-pack (Linux)
        if: runner.os == 'Linux'
        run: curl https://rustwasm.github.io/wasm-pack/installer/init.sh -sSf | sh

      - name: Install wasm-pack (Windows)
        if: runner.os == 'Windows'
        run: cargo install wasm-pack

      - name: Cache WASM artifact
        id: cache-wasm
        uses: actions/cache@v6
        with:
          path: packages/modern-xlsx/wasm/
          key: ${{ runner.os }}-wasm-${{ hashFiles('crates/**/*.rs', 'Cargo.lock') }}
          restore-keys: ${{ runner.os }}-wasm-

      - name: Build WASM
        if: steps.cache-wasm.outputs.cache-hit != 'true'
        run: wasm-pack build crates/modern-xlsx-wasm --target web --release --out-dir ../../packages/modern-xlsx/wasm --no-opt

      - name: Track WASM size
        run: |
          WASM_SIZE=$(stat -c%s packages/modern-xlsx/wasm/modern_xlsx_wasm_bg.wasm 2>/dev/null || stat -f%z packages/modern-xlsx/wasm/modern_xlsx_wasm_bg.wasm 2>/dev/null || wc -c < packages/modern-xlsx/wasm/modern_xlsx_wasm_bg.wasm)
          echo "WASM binary size: ${WASM_SIZE} bytes ($(( WASM_SIZE / 1024 )) KB)"
          if [ "$WASM_SIZE" -gt 2097152 ]; then
            echo "::warning::WASM binary exceeds 2 MB threshold (${WASM_SIZE} bytes)"
          fi
        shell: bash

      - name: Install pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "${{ matrix.node-version }}"
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Type check
        run: pnpm -C packages/modern-xlsx typecheck

      - name: Lint
        run: pnpm -C packages/modern-xlsx lint

      - name: Test
        run: pnpm -C packages/modern-xlsx test

      - name: Build
        run: pnpm -C packages/modern-xlsx build

  browser:
    name: Browser Tests
    needs: rust
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install Rust
        uses: dtolnay/rust-toolchain@beta
        with:
          targets: wasm32-unknown-unknown

      - name: Cache Cargo
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-

      - name: Install wasm-pack
        run: curl https://rustwasm.github.io/wasm-pack/installer/init.sh -sSf | sh

      - name: Cache WASM artifact
        id: cache-wasm
        uses: actions/cache@v6
        with:
          path: packages/modern-xlsx/wasm/
          key: ${{ runner.os }}-wasm-${{ hashFiles('crates/**/*.rs', 'Cargo.lock') }}
          restore-keys: ${{ runner.os }}-wasm-

      - name: Build WASM
        if: steps.cache-wasm.outputs.cache-hit != 'true'
        run: wasm-pack build crates/modern-xlsx-wasm --target web --release --out-dir ../../packages/modern-xlsx/wasm --no-opt

      - name: Install pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "26"
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Playwright browsers
        run: pnpm -C packages/modern-xlsx exec playwright install --with-deps chromium

      - name: Browser tests
        run: pnpm -C packages/modern-xlsx test:browser

  publish:
    name: Publish to npm
    # `security` (cargo audit) gates advisories on the publish path; `deny` gates
    # licenses/bans/sources deterministically. With Cargo.lock committed, an audit
    # failure means a real new CVE against a locked dep — correctly blocking release.
    needs: [rust, typescript, browser, deny, smoke, security]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v7

      - name: Install Rust
        uses: dtolnay/rust-toolchain@beta
        with:
          targets: wasm32-unknown-unknown

      - name: Install wasm-pack
        run: curl https://rustwasm.github.io/wasm-pack/installer/init.sh -sSf | sh

      - name: Build WASM
        run: wasm-pack build crates/modern-xlsx-wasm --target web --release --out-dir ../../packages/modern-xlsx/wasm --no-opt

      - name: Build WASM (lite)
        run: wasm-pack build crates/modern-xlsx-wasm --target web --release --out-dir ../../packages/modern-xlsx/wasm-lite --no-opt -- --no-default-features

      - name: Install pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "26"
          registry-url: "https://registry.npmjs.org"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm -C packages/modern-xlsx build

      - name: Generate SBOM (CycloneDX)
        continue-on-error: true
        run: cd packages/modern-xlsx && npx -y @cyclonedx/cyclonedx-npm@5.0.0 --omit dev --output-file "${RUNNER_TEMP}/sbom.cdx.json"

      - name: Upload SBOM artifact
        uses: actions/upload-artifact@v5
        with:
          name: sbom
          path: ${{ runner.temp }}/sbom.cdx.json
          if-no-files-found: warn

      - name: Publish
        run: |
          cd packages/modern-xlsx
          VERSION=$(node -p "require('./package.json').version")
          if echo "$VERSION" | grep -qE '[-]'; then
            npm publish --provenance --access public --tag next
          else
            npm publish --provenance --access public
          fi
