# cargo-deny configuration — supply-chain, license, and advisory gating.
# Run: cargo deny --locked check   (CI's deny job runs exactly this)

[advisories]
yanked = "deny"
# Add specific RUSTSEC IDs here only with a justification if ever needed.
ignore = []

[licenses]
# Licenses compatible with distributing this MIT-licensed project: only the permissive licenses the dependency tree actually uses (cargo-deny reports any allowed license no crate needs as license-not-encountered).
allow = [
    "MIT",
    "Apache-2.0",
    "Zlib",
    "Unicode-3.0",
    "CC0-1.0",
]
confidence-threshold = 0.9

[bans]
# Duplicate crate versions are surfaced as warnings, not failures.
multiple-versions = "warn"
wildcards = "warn"
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
