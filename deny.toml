# cargo-deny configuration — supply-chain, license, and advisory gating.
# Run: cargo deny check   (CI runs this on every push)

[advisories]
version = 2
yanked = "deny"
# Add specific RUSTSEC IDs here only with a justification if ever needed.
ignore = []

[licenses]
version = 2
# Permissive licenses compatible with this project's MIT/Apache-2.0 dual license.
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "Unicode-3.0",
    "Unicode-DFS-2016",
    "CC0-1.0",
    "MPL-2.0",
]
confidence-threshold = 0.9

[bans]
# Bleeding-edge projects pull many crate versions; surface duplicates without failing.
multiple-versions = "warn"
wildcards = "warn"
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
