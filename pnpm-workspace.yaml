packages:
  - 'packages/*'

onlyBuiltDependencies:
  - esbuild

allowBuilds:
  esbuild: true

# Supply-chain gate: newly published packages must be at least 1 day old before install
# (mitigates compromised just-published versions). Exclusions below are deliberate bleeding-edge pins.
minimumReleaseAge: 1440
minimumReleaseAgeExclude:
  - playwright-core@1.63.0-alpha-2026-08-27
  - playwright@1.63.0-alpha-2026-08-27
  - "@types/node@26.4.0"
