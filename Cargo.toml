[workspace]
resolver = "3"
members = [
    "crates/modern-xlsx-core",
    "crates/modern-xlsx-wasm",
]

[workspace.package]
# Rust crate version — independent from the npm package version (0.5.0)
version = "0.1.0"
edition = "2024"
rust-version = "1.96.0"
license = "MIT OR Apache-2.0"
repository = "https://github.com/ABCrimson/modern-xlsx"

[workspace.dependencies]
# XML parsing — SAX-style, zero-copy, serde support
quick-xml = { version = "0.40.1", features = ["serialize"] }

# Serialization
serde = { version = "1.0", features = ["derive"] }

# ZIP archive — v8 with pure-Rust deflate (zopfli write + flate2/zlib-rs read)
zip = { version = "8.6", default-features = false, features = ["deflate"] }

# Date/time without std::time
chrono = { version = "0.4", default-features = false, features = ["serde"] }

# Error handling
thiserror = "2.0"

# JSON serialization (golden file tests + JSON export)
serde_json = "1.0"

# Logging facade (zero-cost when no backend configured)
log = "0.4"

# Zero-alloc integer formatting for XML output
itoa = "1.0"

# Zero-alloc float formatting for XML/JSON output
ryu = "1.0"

# WASM bindings
wasm-bindgen = "0.2.126"
js-sys = "0.3"
web-sys = { version = "0.3", features = ["Blob", "BlobPropertyBag", "console", "Performance"] }

# Cryptography — ECMA-376 Agile + Standard Encryption (RustCrypto 0.11/0.13/0.9 generation)
digest = { version = "0.11", features = ["alloc"] }
sha2 = "0.11"
sha1 = "0.11"
zeroize = { version = "1.9", features = ["derive"] }
aes = "0.9"
cbc = { version = "0.2", features = ["alloc"] }
hmac = "0.13"
constant_time_eq = "0.5"
getrandom = { version = "0.4", features = ["wasm_js"] }

# Dev
wasm-bindgen-test = "0.3"
pretty_assertions = "1.4"

[workspace.lints.clippy]
# Bleeding-edge: opt into the pedantic group, allowing the subjective / domain-noisy
# lints (this is a numeric/OOXML codebase: casts and exact float compares are intentional).
pedantic = { level = "warn", priority = -1 }
missing_errors_doc = "allow"
missing_panics_doc = "allow"
must_use_candidate = "allow"
doc_markdown = "allow"
too_many_lines = "allow"
similar_names = "allow"
struct_excessive_bools = "allow"
module_name_repetitions = "allow"
cast_possible_truncation = "allow"
cast_precision_loss = "allow"
cast_sign_loss = "allow"
cast_possible_wrap = "allow"
cast_lossless = "allow"
float_cmp = "allow"
match_same_arms = "allow"
assigning_clones = "allow"
unreadable_literal = "allow"
case_sensitive_file_extension_comparisons = "allow"
match_wildcard_for_single_variants = "allow"
needless_continue = "allow"
unnecessary_wraps = "allow"
trivially_copy_pass_by_ref = "allow"
needless_pass_by_value = "allow"
items_after_statements = "allow"
unused_self = "allow"
manual_let_else = "allow"
ref_option = "allow"
default_trait_access = "allow"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
strip = true
panic = "abort"
